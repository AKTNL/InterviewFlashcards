name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backup-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: bash -n tools/server-snapshot.sh tools/check-server-snapshot.sh docs/fixtures/p1-07/rehearse.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: flashcards_test
          POSTGRES_USER: flashcards_test
          # Disposable CI database only; never a deployment credential.
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashcards_test -d flashcards_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/flashcards_test
      DATABASE_USERNAME: flashcards_test
      DATABASE_PASSWORD: ci-only-ephemeral
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -Pintegration verify
  compose:
    runs-on: ubuntu-latest
    env:
      ACCOUNT_USERNAME: ci-only
      # Disposable CI hash only; never use as a deployment credential.
      ACCOUNT_PASSWORD_HASH: '$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start same-origin stack
        env:
          POSTGRES_DB: flashcards_ci
          POSTGRES_USER: flashcards_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
        run: docker compose -f deploy/compose.yml up --build -d --wait --wait-timeout 240
      - name: Check shell, API proxy, migrations and persistence across restart
        run: |
          curl --fail http://127.0.0.1:8088/ | grep -q 'id="app"'
          curl --fail http://127.0.0.1:8088/missing-page | grep -q 'id="app"'
          curl --fail http://127.0.0.1:8088/api/health | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["data"]["database"] == "UP"; assert r["meta"]["requestId"]'
          docker compose -f deploy/compose.yml exec -T db psql -U flashcards_ci -d flashcards_ci -Atc 'select installation_id from application_metadata' > /tmp/installation-before
          docker compose -f deploy/compose.yml exec -T backend sh -c 'printf persistence-probe > /data/files/.ci-probe'
          docker compose -f deploy/compose.yml down
          docker compose -f deploy/compose.yml up -d --wait --wait-timeout 180
          docker compose -f deploy/compose.yml exec -T db psql -U flashcards_ci -d flashcards_ci -Atc 'select installation_id from application_metadata' > /tmp/installation-after
          diff /tmp/installation-before /tmp/installation-after
          docker compose -f deploy/compose.yml exec -T backend sh -c 'test "$(cat /data/files/.ci-probe)" = persistence-probe'
          curl --fail http://127.0.0.1:8088/api/health
        env:
          POSTGRES_DB: flashcards_ci
          POSTGRES_USER: flashcards_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
      - name: Show safe diagnostics and clean up disposable volumes
        if: always()
        env:
          POSTGRES_DB: flashcards_ci
          POSTGRES_USER: flashcards_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
        run: |
          docker compose -f deploy/compose.yml logs --tail=100
          docker compose -f deploy/compose.yml down -v
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Prepare isolated local HTTPS configuration
        shell: pwsh
        run: ./docs/fixtures/p0-13/setup-local.ps1
      - name: Build production stack with private database and Secure cookies
        run: docker compose -p flashcards-p013-acceptance --env-file output/p0-13/.env -f deploy/compose.production.yml up --build -d --wait --wait-timeout 240
      - name: Verify TLS, headers, private endpoints and static resources
        run: python3 tools/release-check.py --base-url https://localhost:8443 --http-url http://localhost:8089 --cafile output/p0-13/tls/fullchain.pem
      - name: Install browser acceptance runtime
        run: |
          npm install --prefix output/p0-13/runner --no-save --package-lock=false playwright@1.62.1
          output/p0-13/runner/node_modules/.bin/playwright install --with-deps chromium
      - name: Real PDF, two sessions, response loss and backup roundtrip
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/output/p0-13/runner/node_modules/playwright
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: node docs/fixtures/p0-13/run-browser.cjs core
      - name: Recreate containers while preserving the same volumes
        run: |
          docker compose -p flashcards-p013-acceptance --env-file output/p0-13/.env -f deploy/compose.production.yml down
          docker compose -p flashcards-p013-acceptance --env-file output/p0-13/.env -f deploy/compose.production.yml up -d --wait --wait-timeout 180
      - name: Verify persistence, mobile reading, failure recovery and destructive confirmations
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/output/p0-13/runner/node_modules/playwright
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: |
          node docs/fixtures/p0-13/run-browser.cjs persistence
          node docs/fixtures/p0-13/run-browser.cjs destructive
      - name: Automatic server backup, retention and isolated recovery drill
        run: bash docs/fixtures/p1-07/rehearse.sh
      - name: Collect redacted diagnostics
        if: always()
        run: docker compose -p flashcards-p013-acceptance --env-file output/p0-13/.env -f deploy/compose.production.yml logs --no-color --tail=200 > output/p0-13/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-https-release-evidence
          path: |
            output/p0-13/*result.json
            output/p0-13/*.png
            output/p0-13/compose.log
          retention-days: 7
      - name: Remove disposable test stack
        if: always()
        run: docker compose -p flashcards-p013-acceptance --env-file output/p0-13/.env -f deploy/compose.production.yml down -v
