name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: flashcards_test
          POSTGRES_USER: flashcards_test
          # Disposable CI database only; never a deployment credential.
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashcards_test -d flashcards_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/flashcards_test
      DATABASE_USERNAME: flashcards_test
      DATABASE_PASSWORD: ci-only-ephemeral
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -Pintegration verify
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start same-origin stack
        env:
          POSTGRES_DB: flashcards_ci
          POSTGRES_USER: flashcards_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
        run: docker compose -f deploy/compose.yml up --build -d --wait --wait-timeout 240
      - name: Check shell, API proxy, migrations and persistence across restart
        run: |
          curl --fail http://127.0.0.1:8088/ | grep -q 'id="app"'
          curl --fail http://127.0.0.1:8088/missing-page | grep -q 'id="app"'
          curl --fail http://127.0.0.1:8088/api/health | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["data"]["database"] == "UP"; assert r["meta"]["requestId"]'
          docker compose -f deploy/compose.yml exec -T db psql -U flashcards_ci -d flashcards_ci -Atc 'select installation_id from application_metadata' > /tmp/installation-before
          docker compose -f deploy/compose.yml exec -T backend sh -c 'printf persistence-probe > /data/files/.ci-probe'
          docker compose -f deploy/compose.yml down
          docker compose -f deploy/compose.yml up -d --wait --wait-timeout 180
          docker compose -f deploy/compose.yml exec -T db psql -U flashcards_ci -d flashcards_ci -Atc 'select installation_id from application_metadata' > /tmp/installation-after
          diff /tmp/installation-before /tmp/installation-after
          docker compose -f deploy/compose.yml exec -T backend sh -c 'test "$(cat /data/files/.ci-probe)" = persistence-probe'
          curl --fail http://127.0.0.1:8088/api/health
        env:
          POSTGRES_DB: flashcards_ci
          POSTGRES_USER: flashcards_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
      - name: Show safe diagnostics and clean up disposable volumes
        if: always()
        env:
          POSTGRES_DB: flashcards_ci
          POSTGRES_USER: flashcards_ci
          POSTGRES_PASSWORD: ci-only-ephemeral
        run: |
          docker compose -f deploy/compose.yml logs --tail=100
          docker compose -f deploy/compose.yml down -v
