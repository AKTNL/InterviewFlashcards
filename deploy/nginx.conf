server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 51m;
    # Avoid logging URI/query strings, credentials or personal content.
    access_log off;
    error_log /dev/stderr crit;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vite emits the PDF.js module worker as .mjs; module workers require a JS MIME type.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # These filenames are versioned with the application, rather than content hashes.
    location /pdfjs/ {
        types { application/wasm wasm; }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
