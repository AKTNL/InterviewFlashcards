spring:
  application:
    name: interview-flashcards
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    log-request-details: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
      location: ${app.storage.temporary-root}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  registration:
    enabled: ${REGISTRATION_ENABLED:false}
    max-accounts: ${REGISTRATION_MAX_ACCOUNTS:100}
  capacity:
    user-bytes: ${USER_STORAGE_MAX_BYTES:536870912}
    sources: ${USER_SOURCE_LIMIT:20}
    imports: ${USER_IMPORT_LIMIT:2}
    backups: ${USER_BACKUP_LIMIT:2}
    global-tasks: ${GLOBAL_TASK_LIMIT:20}
    global-bytes: ${GLOBAL_STORAGE_MAX_BYTES:5368709120}
    reserve-bytes: ${STORAGE_RESERVE_BYTES:536870912}
  learning-timezone: Asia/Shanghai
  account:
    username: ${ACCOUNT_USERNAME}
    password-hash: ${ACCOUNT_PASSWORD_HASH}
  storage:
    root: ${STORAGE_ROOT:./data/files}
    temporary-root: ${STORAGE_TEMP_ROOT:./data/tmp}
    max-bytes: 52428800
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%X{requestId:-startup}] %logger{40} - %msg%n"
